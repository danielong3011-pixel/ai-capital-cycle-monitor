[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-capital-cycle"
version = "0.1.0"
description = "Reproducible research on AI infrastructure investment sustainability"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "streamlit>=1.46", "plotly>=5.18", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
