name: Survey segments (temporary)

on:
  push:
    branches: ["feature/module-b-demand"]
    paths: ["scripts/survey_segments.py", ".github/workflows/survey-segments.yml"]

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/survey_segments.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/_survey/segment_survey.json
          git commit -m "Segment survey output" && git push
